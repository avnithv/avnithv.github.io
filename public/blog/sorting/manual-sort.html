<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand Sort</title>
<style>
  body{
    margin:0;font-family:system-ui,sans-serif;line-height:1.5;
    color:#222;background:#fafafa;padding:2rem 1rem;
  }
  .wrap{max-width:520px;margin:0 auto}
  h1{font-size:1.5rem;margin:0 0 1.5rem;font-weight:600}
  textarea,select{
    width:100%;font:inherit;padding:.6rem;border:1px solid #ccc;
    border-radius:6px;background:#fff;box-sizing:border-box;
  }
  textarea{min-height:130px;resize:vertical}
  select{margin:.8rem 0}
  label{font-size:.85rem;color:#666}
  button{
    font:inherit;cursor:pointer;padding:.6rem 1.2rem;border:1px solid #222;
    border-radius:6px;background:#222;color:#fff;
  }
  button.plain{background:#fff;color:#222}
  .rowline{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.8rem}
  input[type=range]{flex:1;min-width:160px;accent-color:#222}
  #nlabel{font-variant-numeric:tabular-nums;min-width:3.2rem;text-align:right;font-weight:600}
  #compare{margin-top:1.5rem;text-align:center}
  #compare p{color:#888;font-size:.9rem;margin:0 0 1rem}
  .choices{display:flex;align-items:stretch;gap:.6rem;margin:.5rem 0}
  .choice{
    flex:1;display:flex;align-items:center;justify-content:center;text-align:center;
    font-size:1.1rem;padding:1.4rem 1rem;min-height:3.5rem;
    border:1px solid #ccc;border-radius:6px;background:#fff;color:#222;
    word-break:break-word;
  }
  .choice:hover{border-color:#222}
  .vs{display:flex;align-items:center;color:#aaa;font-style:italic;font-size:.9rem}
  .hint{font-size:.78rem;color:#aaa;text-align:center;margin-bottom:.5rem}
  #count{color:#888;font-size:.85rem;margin-top:1rem}
  #estimate{font-size:.8rem;color:#888;margin:-.4rem 0 1rem}
  #notice{
    background:#fff4e0;border:1px solid #e0b060;border-radius:6px;
    padding:.8rem;margin-bottom:1rem;font-size:.9rem;color:#7a5000;text-align:left;
  }
  ol{background:#fff;border:1px solid #ccc;border-radius:6px;padding:1rem 1rem 1rem 2.5rem;margin:0 0 1rem;max-height:60vh;overflow:auto}
  ol li{padding:.25rem 0}
  #itemcount{font-size:.8rem;color:#888;margin:.3rem 0 .2rem}
  #progressWrap{margin-top:1.1rem}
  #progressLabel{font-size:.78rem;color:#888;margin-bottom:.3rem}
  .pbar{height:7px;background:#eee;border-radius:4px;overflow:hidden}
  .pbar>i{display:block;height:100%;width:0;background:#3a5a8a;transition:width .25s ease}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Hand Sort</h1>

  <div id="setup">
    <textarea id="items" placeholder="One item per line"></textarea>
    <div id="itemcount">0 items</div>

    <div class="rowline" style="margin-top:.8rem">
      <label for="category">Random fill from:</label>
      <select id="category" style="width:auto;margin:0;flex:1"></select>
    </div>
    <div class="rowline">
      <input type="range" id="slider" min="2" max="1000" value="8">
      <span id="nlabel">8</span>
      <button class="plain" id="random">Fill</button>
    </div>

    <select id="algo">
      <option value="merge_insertion">Merge-insertion</option>
      <option value="merge">Merge sort</option>
      <option value="quick">Quicksort</option>
      <option value="insertion">Insertion sort</option>
      <option value="stooge">Stooge sort</option>
    </select>
    <div id="estimate"></div>
    <div class="rowline">
      <button id="start">Start</button>
      <button class="plain" id="loadBtn">Load saved sort</button>
      <input type="file" id="loadFile" accept="application/json" class="hidden">
    </div>
  </div>

  <div id="compare" class="hidden">
    <div id="notice" class="hidden"></div>
    <p id="prompt">Which comes first?</p>
    <div class="choices">
      <button class="choice" id="left"></button>
      <span class="vs">vs</span>
      <button class="choice" id="right"></button>
    </div>
    <div class="hint">Tap a card, or use the &larr; / &rarr; arrow keys</div>
    <div id="count"></div>
    <div id="progressWrap">
      <div id="progressLabel"></div>
      <div class="pbar"><i id="progressFill"></i></div>
    </div>
    <div class="rowline" style="margin-top:.8rem">
      <button class="plain" id="save">Save progress</button>
      <button class="plain" id="exit">Exit to home</button>
    </div>
  </div>

  <div id="resultBox" class="hidden">
    <ol id="result"></ol>
    <div class="rowline">
      <button class="plain" id="copy">Copy list</button>
      <button class="plain" id="download">Download .txt</button>
      <button class="plain" id="restart">Start over</button>
    </div>
  </div>
</div>

    // find bracketing measured points, interpolate in log-log
    let lo=xs[0], hi=xs[xs.length-1];
    for(let i=0;i<xs.length-1;i++){ if(n>=xs[i]&&n<=xs[i+1]){ lo=xs[i]; hi=xs[i+1]; break; } }
    const t=(Math.log(n)-Math.log(lo))/(Math.log(hi)-Math.log(lo));
    const val=Math.exp(Math.log(tbl[lo])+t*(Math.log(tbl[hi])-Math.log(tbl[lo])));
    return Math.round(val);
  }
  function refreshEstimate(){
    const actualN=currentItemCount();
    const useN = actualN>=2 ? actualN : sliderN();
    const c=estimateComparisons(useN,$("algo").value);
    const src = actualN>=2 ? actualN+" items" : "~"+useN+" items (slider)";
    $("estimate").textContent="Estimated \u2248"+c.toLocaleString()+" comparisons for "+src;
  }
  $("algo").onchange=refreshEstimate;
  $("items").addEventListener("input",()=>{ refreshItemCount(); refreshEstimate(); });

  // Populate the category dropdown from CATEGORIES.
  (function initCategories(){
    const sel=$("category");
    for(const name of Object.keys(CATEGORIES)){
      const o=document.createElement("option"); o.value=name; o.textContent=name; sel.appendChild(o);
    }
  })();
  $("category").onchange=()=>{ capSliderToCategory(); refreshEstimate(); };

  $("random").onclick=()=>{
    const cat=$("category").value;
    const words=CATEGORIES[cat]||[];
    let n=sliderN();
    if(n>words.length) n=words.length;
    const pool=words.slice();
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
    $("items").value=pool.slice(0,n).join("\n");
    refreshItemCount(); refreshEstimate();
  };

  function relText(a,b,c){ return c<0? a+" < "+b : c>0? a+" > "+b : a+" = "+b; }

  // Progress = fraction of ordering-uncertainty eliminated so far.
  // At the start, all n! orderings are possible (log2(n!) bits of uncertainty); when
  // sorting finishes, exactly 1 remains (0 bits). Progress is the fraction of those bits
  // removed. For small n we count the linear extensions still consistent with the known
  // relations exactly; for large n (counting is #P-complete) we use the fraction of pairs
  // whose order is known, which tracks the true value closely and is O(n^2).
  let progressItems=[];
  function knownRelations(){
    // Build directed reachability (a<b) from the answers recorded in the cache.
    const items=progressItems, idx=new Map(items.map((x,i)=>[x,i])), n=items.length;
    const reach=Array.from({length:n},()=>new Set());
    const addEdge=(a,b)=>{ const u=idx.get(a),v=idx.get(b); if(u!==undefined&&v!==undefined) reach[u].add(v); };
    for(const k in cache){ const v=cache[k]; if(v<0){ const [a,b]=k.split("\u0000"); addEdge(a,b); } }
    // transitive closure
    let changed=true;
    while(changed){ changed=false;
      for(let a=0;a<n;a++) for(const b of [...reach[a]]) for(const c of reach[b])
        if(!reach[a].has(c)){ reach[a].add(c); changed=true; } }
    return {reach, n};
  }
  function log2fact(n){ let s=0; for(let k=2;k<=n;k++) s+=Math.log2(k); return s; }
  function countExtensions(reach, n){
    // exact count of linear extensions via bitmask DP (only called for small n)
    const memo=new Map();
    const pred=new Array(n).fill(0);
    for(let a=0;a<n;a++) for(const b of reach[a]) pred[b]|=(1<<a);
    function cnt(rem){
      if(rem===0) return 1;
      const cached=memo.get(rem); if(cached!==undefined) return cached;
      let t=0;
      for(let i=0;i<n;i++){ if(!(rem&(1<<i))) continue;
        if((pred[i] & rem)===0) t+=cnt(rem & ~(1<<i)); }  // i placeable if no predecessor remains
      memo.set(rem,t); return t;
    }
    return cnt((1<<n)-1);
  }
  function updateProgress(){
    const n=progressItems.length;
    let frac;
    if(n<2){ frac=1; }
    else {
      const {reach}=knownRelations();
      if(n<=10){
        const total=log2fact(n);
        const ext=countExtensions(reach, n);
        frac = total>0 ? (total - Math.log2(ext))/total : 1;
      } else {
        // known-pair fraction (transitively closed): close approximation, O(n^2)
        let known=0; const tot=n*(n-1)/2;
        for(let i=0;i<n;i++) for(let j=i+1;j<n;j++) if(reach[i].has(j)||reach[j].has(i)) known++;
        frac = tot>0 ? known/tot : 1;
      }
    }
    frac=Math.max(0, Math.min(1, frac));
    $("progressFill").style.width=(frac*100).toFixed(1)+"%";
    $("progressLabel").textContent="Progress: about "+Math.round(frac*100)+"% of the order determined";
  }

  // Ask the user a single comparison. Every comparison the sort makes is asked plainly;
  // the answer is recorded and returned. Inconsistent answers are accepted as given.
  function askUser(a,b){
    comparisons++;
    $("left").textContent=a; $("right").textContent=b;
    $("count").textContent=comparisons+(comparisons===1?" comparison":" comparisons");
    return new Promise(res=>{
      resolver=v=>{
        cache[key(a,b)]=v; cache[key(b,a)]=-v;
        updateProgress();
        res(v);
      };
    });
  }
  // left = "a comes first" (a<b, returns -1); right = "b comes first" (a>b, returns +1).
  function pickLeft(){ resolver&&resolver(-1); }
  function pickRight(){ resolver&&resolver(1); }
  $("left").onclick = pickLeft;
  $("right").onclick = pickRight;
  // Arrow keys answer the current comparison when the compare screen is showing.
  document.addEventListener("keydown",(e)=>{
    if($("compare").classList.contains("hidden")) return;
    if(e.key==="ArrowLeft"){ e.preventDefault(); pickLeft(); }
    else if(e.key==="ArrowRight"){ e.preventDefault(); pickRight(); }
  });

  const algos={
    async insertion(arr,cmp){
      const a=arr.slice();
      for(let i=1;i<a.length;i++){let j=i;
        while(j>0&&(await cmp(a[j-1],a[j]))>0){[a[j-1],a[j]]=[a[j],a[j-1]];j--;}}
      return a;
    },
    async merge(arr,cmp){
      if(arr.length<=1) return arr;
      const mid=arr.length>>1;
      const L=await algos.merge(arr.slice(0,mid),cmp), R=await algos.merge(arr.slice(mid),cmp);
      const o=[];let i=0,j=0;
      while(i<L.length&&j<R.length) ((await cmp(L[i],R[j]))<=0)?o.push(L[i++]):o.push(R[j++]);
      while(i<L.length)o.push(L[i++]); while(j<R.length)o.push(R[j++]); return o;
    },
    async quick(arr,cmp){
      if(arr.length<=1) return arr;
      const p=arr[Math.floor(Math.random()*arr.length)];
      const lo=[],eq=[],hi=[];
      for(const x of arr){ if(x===p){eq.push(x);continue;} const c=await cmp(x,p);(c<0?lo:c>0?hi:eq).push(x);}
      return [...await algos.quick(lo,cmp),...eq,...await algos.quick(hi,cmp)];
    },

    // Ford-Johnson merge-insertion: near comparison-optimal for small n.
    // Items are unique strings, so indexOf(winner) is unambiguous.
    async merge_insertion(arr,cmp){
      const binInsertBounded=async(chain,x,hiLimit)=>{
        let lo=0,hi=hiLimit;
        while(lo<hi){const m=(lo+hi)>>1;((await cmp(chain[m],x))<=0)?lo=m+1:hi=m;}
        chain.splice(lo,0,x);};
      const jacob=(k)=>Math.round((Math.pow(2,k+1)+Math.pow(-1,k))/3);
      const rec=async(a)=>{
        const n=a.length; if(n<=1) return a.slice();
        const pairs=[]; let odd=null;
        for(let i=0;i+1<n;i+=2){ const x=a[i],y=a[i+1];
          (await cmp(x,y))<=0 ? pairs.push({lo:x,hi:y}) : pairs.push({lo:y,hi:x}); }
        if(n%2) odd=a[n-1];
        const winners=pairs.map(p=>p.hi);
        const sortedWinners=await rec(winners);
        const loserByHi=new Map();
        for(const p of pairs){ if(!loserByHi.has(p.hi)) loserByHi.set(p.hi,[]); loserByHi.get(p.hi).push(p.lo); }
        const chain=sortedWinners.slice();
        const pend=[];
        for(const w of sortedWinners){ const l=loserByHi.get(w); if(l&&l.length) pend.push({lo:l.pop(),hiVal:w}); }
        if(odd!==null) pend.push({lo:odd,hiVal:null});
        const inserted=new Array(pend.length).fill(false); const order=[]; let k=1;
        while(order.length<pend.length){
          const j=jacob(k), jp=jacob(k-1);
          for(let idx=Math.min(j,pend.length)-1; idx>=jp && idx>=0; idx--)
            if(!inserted[idx]){inserted[idx]=true;order.push(idx);}
          k++;
          if(k>40){for(let idx=0;idx<pend.length;idx++) if(!inserted[idx]){inserted[idx]=true;order.push(idx);} break;}
        }
        for(const idx of order){ const {lo,hiVal}=pend[idx];
          let bound=chain.length; if(hiVal!==null){const wp=chain.indexOf(hiVal); if(wp>=0) bound=wp;}
          await binInsertBounded(chain,lo,bound); }
        return chain;};
      return await rec(arr.slice());
    },

    // Stooge sort: swap ends if out of order, then recurse on first 2/3,
    // last 2/3, and first 2/3 again. O(n^2.71) -- keep n tiny.
    async stooge(arr,cmp){
      const a=arr.slice();
      const rec=async(i,j)=>{ if((await cmp(a[i],a[j]))>0){[a[i],a[j]]=[a[j],a[i]];}
        if(j-i+1>2){ const t=Math.floor((j-i+1)/3); await rec(i,j-t); await rec(i+t,j); await rec(i,j-t);} };
      if(a.length>1) await rec(0,a.length-1); return a;
    }
  };

  let runToken=0;           // increments to invalidate a stale in-flight sort
  let currentItems=null, currentAlgo=null;

  class Abort{}             // thrown to unwind an aborted sort

  async function beginSort(){
    const myToken=++runToken;
    comparisons=0;
    let sorted;
    try{
      sorted=await fullSortGuarded(currentAlgo, myToken);
    }catch(e){ if(e instanceof Abort) return; throw e; }
    if(myToken!==runToken) return;   // superseded
    showResult(sorted);
  }

  async function fullSortGuarded(algoName, myToken){
    const items=currentItems;
    const algo=algos[algoName];
    const cmp=async(a,b)=>{
      if(myToken!==runToken) throw new Abort();
      if(cache[key(a,b)]!==undefined) return cache[key(a,b)];
      const v=await askUser(a,b);
      if(myToken!==runToken) throw new Abort();
      return v;
    };
    return await algo(items, cmp);   // the algorithm's output is the sorted order
  }

  function showResult(sorted){
    lastSorted=sorted.slice();
    $("compare").classList.add("hidden");
    $("result").innerHTML="";
    sorted.forEach(x=>{ const li=document.createElement("li"); li.textContent=x; $("result").appendChild(li); });
    $("resultBox").classList.remove("hidden");
  }

  function goHome(){
    runToken++;                 // invalidate any in-flight sort
    resolver=null;
    $("compare").classList.add("hidden");
    $("resultBox").classList.add("hidden");
    $("notice").classList.add("hidden");
    $("setup").classList.remove("hidden");
  }
  $("exit").onclick=goHome;

  // Launch a sort. If `restore` is provided, pre-populate the answer cache from a save.
  function launchSort(uniq, algoName, restore){
    cache={};
    currentItems=uniq; currentAlgo=algoName;
    if(restore && restore.cache) for(const k in restore.cache) cache[k]=restore.cache[k];
    progressItems=uniq.slice();
    $("progressFill").style.width="0%"; $("progressLabel").textContent="Progress: 0% of the order determined";
    $("notice").classList.add("hidden");
    $("setup").classList.add("hidden");
    $("resultBox").classList.add("hidden");
    $("compare").classList.remove("hidden");
    updateProgress();
    beginSort();
  }

  $("start").onclick=()=>{
    const raw=$("items").value.split("\n").map(s=>s.trim()).filter(Boolean);
    const uniq=[...new Set(raw)];
    if(uniq.length<2){alert("Enter at least two distinct items, one per line.");return;}
    launchSort(uniq, $("algo").value, null);
  };

  // ---- Save / load a session ----
  // We serialize enough to resume: items, algorithm, and all answered comparisons (cache).
  function serializeCache(){
    // cache keys are "a\u0000b"; store only one direction per pair to keep it compact
    const seen=new Set(); const out={};
    for(const k in cache){ const [a,b]=k.split("\u0000");
      const canon = a<b ? a+"\u0000"+b : b+"\u0000"+a;
      if(seen.has(canon)) continue; seen.add(canon);
      out[canon]= (a<b)? cache[k] : -cache[k];  // store direction for a<b ordering
    }
    return out;
  }
  function rehydrateCache(saved){
    const c={};
    for(const k in saved){ const [a,b]=k.split("\u0000"); const v=saved[k];
      c[a+"\u0000"+b]=v; c[b+"\u0000"+a]=-v; }
    return c;
  }
  $("save").onclick=()=>{
    const data={
      version:1, algo:currentAlgo, items:currentItems,
      cache:serializeCache(),
      savedAt:new Date().toISOString()
    };
    const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download="hand-sort-"+(currentAlgo||"sort")+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  };
  $("loadBtn").onclick=()=>$("loadFile").click();
  $("loadFile").onchange=(e)=>{
    const file=e.target.files&&e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const data=JSON.parse(reader.result);
        if(!data.items||!data.algo){ alert("That file doesn't look like a saved sort."); return; }
        // reflect into the setup UI too, so exiting shows the right state
        $("items").value=data.items.join("\n");
        $("algo").value=data.algo;
        refreshItemCount(); refreshEstimate();
        launchSort(data.items, data.algo, { cache: rehydrateCache(data.cache||{}) });
      }catch(err){ alert("Could not read that file: "+err.message); }
    };
    reader.readAsText(file);
    e.target.value="";   // allow re-loading the same file later
  };

  // ---- Copy / download the final list ----
  $("copy").onclick=async()=>{
    const text=lastSorted.join("\n");
    try{ await navigator.clipboard.writeText(text); flash($("copy"),"Copied!"); }
    catch(_){ // fallback for environments without clipboard permission
      const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta);
      ta.select(); try{document.execCommand("copy");}catch(e){} ta.remove(); flash($("copy"),"Copied!");
    }
  };
  $("download").onclick=()=>{
    const blob=new Blob([lastSorted.join("\n")+"\n"],{type:"text/plain"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download="sorted-list.txt";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  };
  function flash(btn,msg){ const old=btn.textContent; btn.textContent=msg;
    setTimeout(()=>{ btn.textContent=old; }, 1200); }

  $("restart").onclick=()=>{ runToken++; $("resultBox").classList.add("hidden"); $("setup").classList.remove("hidden"); };

  capSliderToCategory();
  refreshItemCount();
  refreshLabel();
  refreshEstimate();
})();
</script>
</body>
</html>
